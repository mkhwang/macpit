name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Selftest
        run: swift run macpit-selftest
      - name: Bundle
        run: ./scripts/build.sh
